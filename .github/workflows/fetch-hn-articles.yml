name: Fetch HN Top Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 html5lib git-filter-repo

      - name: Remove previous articles from git history
        run: |
          git filter-repo --force --path articles/ --invert-paths
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          else
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Fetch and save HN articles
        run: python scripts/fetch_hn_articles.py

      - name: Commit articles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add articles/
          git diff --staged --quiet || git commit -m "Update HN articles - $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force-with-lease origin HEAD:${{ github.ref_name }}
